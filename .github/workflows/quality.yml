name: Static app quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify DOM to JavaScript selector contract
        run: node tests/dom-contract.mjs
      - name: Verify application entry points
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          grep -q 'app.js' index.html
          grep -q 'style.css' index.html
      - name: Install browser test runtime
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real-browser regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/warlike-http.log 2>&1 &
          sleep 2
          node tests/browser-smoke.mjs
