name: Static app quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify application entry points
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          grep -q 'app.js' index.html
          grep -q 'style.css' index.html
